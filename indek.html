<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Duel Informatika</title>
    <style>
        :root {
            --p1-color: #3b82f6;
            --p2-color: #ef4444;
            --ai-color: #a855f7;
            --primary: #6366f1;
            --dark: #0f172a;
            --light: #f8fafc;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #game-container {
            width: 95%;
            max-width: 800px;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .screen { text-align: center; }

        .mode-selection {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
            width: 200px;
        }

        .mode-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .arena-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .player-box {
            width: 38%;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .player-box.active {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        .hp-bar-container {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.5s ease;
        }

        .timer-ring {
            width: 65px;
            height: 65px;
            border: 4px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 2.5rem;
            line-height: 1.4;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            text-align: left;
        }

        .btn-option:hover:not(:disabled) {
            background: var(--primary);
            transform: scale(1.02);
        }

        .btn-option:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-main {
            margin-top: 2rem;
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .mode-selection { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="game-container">
        <!-- Main Menu -->
        <div id="start-screen" class="screen">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">DUEL INFORMATIKA</h1>
            <p style="color: #94a3b8; margin-bottom: 2rem;">Raih 15 poin untuk menang. Waktu menjawab 15 detik!</p>
            
            <div class="mode-selection">
                <div class="mode-card" onclick="startGame('solo')">
                    <div style="font-size: 3rem; margin-bottom: 10px;">👤</div>
                    <h3>SOLO VS AI</h3>
                </div>
                <div class="mode-card" onclick="startGame('pvp')">
                    <div style="font-size: 3rem; margin-bottom: 10px;">⚔️</div>
                    <h3>PVP LOKAL</h3>
                </div>
            </div>
        </div>

        <!-- Gameplay -->
        <div id="quiz-section" style="display: none;">
            <div class="arena-hud">
                <div id="p1-hud" class="player-box">
                    <div style="font-weight: bold; color: var(--p1-color);">PLAYER 1</div>
                    <div class="hp-bar-container">
                        <div id="p1-hp" class="hp-bar-fill" style="background: var(--p1-color);"></div>
                    </div>
                    <div>Skor: <span id="p1-score">0</span>/15</div>
                </div>

                <div id="timer-display" class="timer-ring">15</div>

                <div id="p2-hud" class="player-box">
                    <div id="p2-label" style="font-weight: bold; color: var(--ai-color);">AI BOT</div>
                    <div class="hp-bar-container">
                        <div id="p2-hp" class="hp-bar-fill" style="background: var(--ai-color);"></div>
                    </div>
                    <div>Skor: <span id="p2-score">0</span>/15</div>
                </div>
            </div>

            <div id="q-text" class="question-text">Menyiapkan tantangan...</div>

            <div id="options-box" class="options-grid"></div>
        </div>

        <!-- Result -->
        <div id="result-screen" class="screen" style="display: none;">
            <h1 id="winner-msg" style="font-size: 3.5rem; margin-bottom: 1rem;">MENANG!</h1>
            <p id="final-stats" style="font-size: 1.2rem;"></p>
            <button class="btn-main" onclick="location.reload()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        const rawQuestions = [
            { q: "Apa kepanjangan dari CPU?", a: ["Central Processing Unit", "Control Power Unit", "Core Program Unit", "Central Program Unit"], c: 0 },
            { q: "Perangkat keras untuk menyimpan data permanen adalah...", a: ["RAM", "Monitor", "Hard Disk", "Speaker"], c: 2 },
            { q: "Sistem bilangan yang menggunakan basis 2 adalah...", a: ["Oktal", "Desimal", "Biner", "Heksadesimal"], c: 2 },
            { q: "Shortcut keyboard untuk menyalin (copy) adalah...", a: ["Ctrl + V", "Ctrl + X", "Ctrl + Z", "Ctrl + C"], c: 3 },
            { q: "Komponen yang disebut sebagai otak komputer adalah...", a: ["Motherboard", "Power Supply", "Prosesor", "RAM"], c: 2 },
            { q: "WWW singkatan dari...", a: ["Wide World Web", "Web World Wide", "World Wide Web", "World Web Wide"], c: 2 },
            { q: "Bahasa pemrograman untuk kerangka website adalah...", a: ["CSS", "Java", "Python", "HTML"], c: 3 },
            { q: "Kepanjangan dari RAM adalah...", a: ["Read Access Memory", "Random Access Memory", "Rapid Action Memory", "Real Audio Memory"], c: 1 },
            { q: "Sistem operasi open-source yang populer adalah...", a: ["Windows", "macOS", "Linux", "iOS"], c: 2 },
            { q: "Alamat unik komputer dalam jaringan disebut...", a: ["IP Address", "Home Address", "User ID", "MAC Address"], c: 0 },
            { q: "Penyimpanan data yang menggunakan chip flash adalah...", a: ["DVD", "Flashdisk", "SSD", "VGA"], c: 2 },
            { q: "Simbol perkalian di Microsoft Excel adalah...", a: ["x", ":", "+", "*"], c: 3 },
            { q: "Software yang dirancang untuk merusak sistem disebut...", a: ["Freeware", "Malware", "Shareware", "Firmware"], c: 1 },
            { q: "Kepanjangan dari URL adalah...", a: ["Unique Resource Locator", "Uniform Resource Locator", "Unit Resource Line", "Universal Resource Locator"], c: 1 },
            { q: "Satuan kecepatan internet adalah...", a: ["Kg", "Celsius", "Mbps", "Hertz"], c: 2 }
        ];

        let mode = 'solo';
        let p1 = { score: 0, hp: 100 };
        let p2 = { score: 0, hp: 100 };
        let currentTurn = 1; 
        let timeLeft = 15;
        let timerId = null;
        let activeQuestions = [];
        const TARGET = 15;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame(selectedMode) {
            mode = selectedMode;
            activeQuestions = shuffle([...rawQuestions]);
            
            if (mode === 'pvp') {
                document.getElementById('p2-label').innerText = "PLAYER 2";
                document.getElementById('p2-label').style.color = "var(--p2-color)";
                document.getElementById('p2-hp').style.background = "var(--p2-color)";
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            
            nextQuestion();
        }

        function nextQuestion() {
            if (p1.score >= TARGET || p2.hp <= 0) return showResult(1);
            if (p2.score >= TARGET || p1.hp <= 0) return showResult(mode === 'solo' ? 'AI' : 2);

            updateHUD();

            clearInterval(timerId);
            timeLeft = 15;
            document.getElementById('timer-display').innerText = timeLeft;
            document.getElementById('timer-display').style.borderColor = "var(--primary)";

            const q = activeQuestions[Math.floor(Math.random() * activeQuestions.length)];
            
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-text').style.color = 'white';

            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';

            q.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, q.c);
                optBox.appendChild(btn);
            });

            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                if (timeLeft <= 5) document.getElementById('timer-display').style.borderColor = "var(--danger)";
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    processResult(false, "Waktu Habis!");
                }
            }, 1000);

            if (mode === 'solo' && currentTurn === 2) {
                document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
                setTimeout(() => {
                    const isAiCorrect = Math.random() > 0.4;
                    const chosenIdx = isAiCorrect ? q.c : (q.c + 1) % 4;
                    checkAnswer(chosenIdx, q.c);
                }, 1500);
            }
        }

        function checkAnswer(selected, correct) {
            clearInterval(timerId);
            const isCorrect = (selected === correct);
            processResult(isCorrect, isCorrect ? "Jawaban Benar!" : "Jawaban Salah!");
        }

        function processResult(isCorrect, message) {
            const qText = document.getElementById('q-text');
            qText.innerText = message;
            qText.style.color = isCorrect ? 'var(--success)' : 'var(--danger)';
            
            document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);

            if (isCorrect) {
                if (currentTurn === 1) p1.score++; else p2.score++;
            } else {
                if (currentTurn === 1) p1.hp -= 20; else p2.hp -= 20;
            }

            setTimeout(() => {
                currentTurn = currentTurn === 1 ? 2 : 1;
                nextQuestion();
            }, 1200);
        }

        function updateHUD() {
            document.getElementById('p1-score').innerText = p1.score;
            document.getElementById('p2-score').innerText = p2.score;
            document.getElementById('p1-hp').style.width = p1.hp + '%';
            document.getElementById('p2-hp').style.width = p2.hp + '%';

            document.getElementById('p1-hud').classList.toggle('active', currentTurn === 1);
            document.getElementById('p2-hud').classList.toggle('active', currentTurn === 2);
        }

        function showResult(winner) {
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            const msg = document.getElementById('winner-msg');
            const stats = document.getElementById('final-stats');

            if (winner === 'AI') {
                msg.innerText = "AI MENANG!";
                msg.style.color = 'var(--ai-color)';
                stats.innerText = "Komputer terlalu tangguh. Coba lagi!";
            } else {
                msg.innerText = `PEMAIN ${winner} MENANG!`;
                msg.style.color = winner === 1 ? 'var(--p1-color)' : 'var(--p2-color)';
                stats.innerText = `Skor Akhir: ${winner === 1 ? p1.score : p2.score} Poin.`;
            }
        }

        // Particle background logic
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1; this.vx = Math.random() - 0.5; this.vy = Math.random() - 0.5;
            }
            draw() {
                ctx.fillStyle = "rgba(99, 102, 241, 0.15)";
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
                this.x += this.vx; this.y += this.vy;
                if(this.x<0 || this.x>canvas.width || this.y<0 || this.y>canvas.height) this.reset();
            }
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => p.draw());
            requestAnimationFrame(animate);
        }
        window.onload = () => { resize(); for(let i=0;i<80;i++) particles.push(new Particle()); animate(); };
        window.onresize = resize;
    </script>
</body>
</html>
